<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SDN Controller Security Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="dashboard">
    <header class="hero card fade-in">
      <h1>SDN Controller Security Dashboard</h1>
      <p>TPM-Based Device Authentication System</p>
    </header>

    <section class="status-wrap card fade-in-delay">
      <div id="global-status" class="status waiting pulse">
        <span class="dot"></span>
        <span class="label">WAITING FOR DEVICES...</span>
      </div>
    </section>

    <section class="table-wrap card fade-in-delay-2">
      <div class="table-head">
        <h2>Connected Devices</h2>
        <div id="spinner" class="spinner hidden" aria-label="loading"></div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Device ID</th>
            <th>Path</th>
            <th>Status</th>
            <th>Reason</th>
            <th>Verify Time (ms)</th>
          </tr>
        </thead>
        <tbody id="device-body">
          <tr class="empty-row">
            <td colspan="5">No devices detected yet.</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
